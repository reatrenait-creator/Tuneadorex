<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LeamsiTUNER Ultra Studio Deluxe Pro - Afinador de Guitarra</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #130a21;
      --card-bg: rgba(28, 16, 48, 0.85);
      --card-border: rgba(176, 38, 255, 0.25);
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-red: #ff0055;
      --accent-yellow: #ffb700;
      --accent-purple: #b026ff;
      --accent-orange: #ff5722;
      --accent-blue: #0077ff;
      --text-main: #f0f4f8;
      --text-muted: #8b80b2;
      --font-display: 'Orbitron', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(176, 38, 255, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.12) 0%, transparent 60%);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0.8rem;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* SPLASH SCREEN STYLING */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-color: #0b0517;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo-wrapper {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loader-ring-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .loader-bg-circle {
      fill: none;
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 8;
    }

    .loader-progress-circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 628;
      stroke-dashoffset: 628;
      transition: stroke 0.2s linear;
    }

    .splash-logo-inner {
      width: 176px;
      height: 176px;
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.9);
      z-index: 2;
    }

    .splash-logo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-reveal-text {
      font-family: var(--font-display);
      font-size: 2.3rem;
      font-weight: 900;
      letter-spacing: 3px;
      margin-top: 2rem;
      background: linear-gradient(90deg, #ffffff, var(--accent-cyan), var(--accent-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      text-shadow: 0 0 25px rgba(176, 38, 255, 0.6);
    }

    .brand-reveal-text.show {
      opacity: 1;
      transform: translateY(0);
    }

    .loading-percent {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.8rem;
      letter-spacing: 2px;
    }

    /* HEADER */
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0.2rem;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      box-shadow: 0 0 15px rgba(176, 38, 255, 0.5);
    }

    .brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ffffff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .signal-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-display);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--text-muted);
      transition: background-color 0.3s, box-shadow 0.3s;
    }

    .status-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    /* MAIN LAYOUT */
    main {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      flex: 1;
      justify-content: center;
    }

    /* CONFIGURATION & CALIBRATION BAR */
    .config-bar {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .config-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .config-title {
      font-size: 0.65rem;
      color: var(--text-muted);
      font-family: var(--font-display);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .config-select {
      background: rgba(19, 10, 33, 0.9);
      color: var(--accent-cyan);
      border: none;
      font-family: var(--font-display);
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
      width: 100%;
      margin-top: 2px;
    }

    .a4-calibration-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
    }

    .btn-a4 {
      background: rgba(176, 38, 255, 0.2);
      border: 1px solid var(--accent-purple);
      color: var(--text-main);
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-family: var(--font-display);
      font-weight: 800;
      cursor: pointer;
    }

    .a4-value {
      font-family: var(--font-display);
      font-size: 0.85rem;
      color: var(--accent-green);
    }

    /* GAUGE CARD */
    .gauge-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 1.4rem 1rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      transition: border-color 0.4s, box-shadow 0.4s;
    }

    .gauge-card.tuned {
      border-color: var(--accent-green);
      box-shadow: 0 0 35px rgba(0, 255, 136, 0.25), inset 0 0 15px rgba(0, 255, 136, 0.1);
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1.35;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .tuning-direction-indicator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 2rem;
      margin-top: -15px;
      z-index: 3;
    }

    .arrow-indicator {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--text-muted);
      opacity: 0.3;
      transition: color 0.3s, opacity 0.3s;
    }

    .arrow-indicator.active-low {
      color: var(--accent-red);
      opacity: 1;
      text-shadow: 0 0 10px var(--accent-red);
    }

    .arrow-indicator.active-high {
      color: var(--accent-yellow);
      opacity: 1;
      text-shadow: 0 0 10px var(--accent-yellow);
    }

    .note-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .note-name {
      font-family: var(--font-display);
      font-size: 4rem;
      font-weight: 900;
      line-height: 1;
      color: var(--text-main);
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      transition: color 0.3s, text-shadow 0.3s;
    }

    .note-name.tuned {
      color: var(--accent-green);
      text-shadow: 0 0 25px rgba(0, 255, 136, 0.8);
    }

    .freq-display {
      font-family: var(--font-display);
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .cents-display {
      font-family: var(--font-display);
      font-size: 0.8rem;
      color: var(--accent-cyan);
      margin-top: 2px;
    }

    .success-badge {
      opacity: 0;
      transform: translateY(10px) scale(0.9);
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 240, 255, 0.2));
      border: 1px solid var(--accent-green);
      color: var(--accent-green);
      padding: 6px 18px;
      border-radius: 30px;
      font-family: var(--font-display);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin-top: 0.6rem;
      pointer-events: none;
    }

    .success-badge.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* STRINGS BAR WITH SOLID INDIVIDUAL COLORS */
    .strings-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .btn-string {
      flex: 1;
      padding: 10px 0;
      border-radius: 12px;
      border: none;
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
      opacity: 0.85;
    }

    .btn-string:active, .btn-string.active {
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 0 15px currentColor;
    }

    .btn-string:nth-child(1) { background-color: #ff0055; }
    .btn-string:nth-child(2) { background-color: #ff6d00; }
    .btn-string:nth-child(3) { background-color: #ffb700; }
    .btn-string:nth-child(4) { background-color: #00ff88; color: #000; }
    .btn-string:nth-child(5) { background-color: #00f0ff; color: #000; }
    .btn-string:nth-child(6) { background-color: #b026ff; }

    /* REAL-TIME VISUALIZERS */
    .vis-container {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .vis-card {
      height: 44px;
      background: rgba(13, 6, 26, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      overflow: hidden;
    }

    .vis-card canvas {
      width: 100%;
      height: 100%;
    }

    /* ACTION BUTTONS GRID */
    .action-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .btn-action {
      padding: 0.85rem 1rem;
      border-radius: 16px;
      border: none;
      font-family: var(--font-display);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .btn-mic-main {
      grid-column: span 2;
      background-color: #00c853;
      color: #000;
      font-size: 0.9rem;
      padding: 1rem;
    }
    .btn-mic-main.listening {
      background-color: #ff1744;
      color: #fff;
    }

    .btn-mode { background-color: #2979ff; }
    .btn-tone { background-color: #ff6d00; }
    .btn-wave { background-color: #7c4dff; }
    .btn-gate { background-color: #00b0ff; }

    footer {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-align: center;
      padding: 0.3rem 0;
    }

    @media (max-height: 670px) {
      .gauge-card { padding: 1rem 1rem 0.8rem 1rem; }
      .note-name { font-size: 3.2rem; }
      .canvas-wrapper { max-width: 220px; }
      .splash-logo-wrapper { width: 170px; height: 170px; }
      .splash-logo-inner { width: 130px; height: 130px; }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN DE CARGA -->
  <div id="splash-screen">
    <div class="splash-logo-wrapper">
      <svg class="loader-ring-svg" viewBox="0 0 220 220">
        <circle class="loader-bg-circle" cx="110" cy="110" r="100"></circle>
        <circle class="loader-progress-circle" id="loaderCircle" cx="110" cy="110" r="100"></circle>
      </svg>

      <div class="splash-logo-inner">
        <img id="logoImgSplash" src="https://i.postimg.cc/wBbdwN19/0f59ff27-8a9f-4c1a-a4c8-7de3e1344b79.jpg" alt="Leamsirec Logo">
      </div>
    </div>

    <div class="brand-reveal-text" id="brandRevealText">LeamsiTUNER</div>
    <div class="loading-percent" id="loadingPercent">CARGANDO... 0%</div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-logo">
        <img id="logoImgHeader" src="https://i.postimg.cc/wBbdwN19/0f59ff27-8a9f-4c1a-a4c8-7de3e1344b79.jpg" alt="Leamsirec Logo">
      </div>
      <span class="brand-title">LeamsiTUNER</span>
    </div>
    <div class="signal-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">LISTO</span>
    </div>
  </header>

  <!-- MAIN TUNER LAYOUT -->
  <main>
    <!-- CONFIGURACIÓN: AFINACIÓN + CALIBRACIÓN A4 -->
    <div class="config-bar">
      <div class="config-box">
        <span class="config-title">PRESET DE AFINACIÓN</span>
        <select class="config-select" id="presetSelect">
          <option value="STD">Estándar (E A D G B E)</option>
          <option value="DROPD">Drop D (D A D G B E)</option>
          <option value="HALF">Medio Tono Abajo</option>
          <option value="FULL">Tono Completo Abajo</option>
        </select>
      </div>

      <div class="config-box">
        <span class="config-title">CALIBRACIÓN A4</span>
        <div class="a4-calibration-wrap">
          <button class="btn-a4" id="btnA4Down">-</button>
          <span class="a4-value" id="a4ValueDisplay">440 Hz</span>
          <button class="btn-a4" id="btnA4Up">+</button>
        </div>
      </div>
    </div>

    <!-- TARJETA DEL MEDIDOR PRINCIPAL -->
    <div class="gauge-card" id="gaugeCard">
      <div class="canvas-wrapper">
        <canvas id="gaugeCanvas" width="600" height="420"></canvas>
      </div>

      <div class="tuning-direction-indicator">
        <span class="arrow-indicator" id="arrowLow">◄ TENSAR</span>
        <span class="arrow-indicator" id="arrowHigh">AFLOJAR ►</span>
      </div>

      <div class="note-container">
        <div class="note-name" id="noteDisplay">--</div>
        <div class="freq-display" id="freqDisplay">0.0 Hz</div>
        <div class="cents-display" id="centsDisplay">0 Cents</div>
      </div>

      <div class="success-badge" id="successBadge">
        AFINACIÓN CON ÉXITO
      </div>
    </div>

    <!-- CUERDAS CON COLORES SÓLIDOS -->
    <div class="strings-bar">
      <button class="btn-string" data-note="E2" data-freq="82.41">6E</button>
      <button class="btn-string" data-note="A2" data-freq="110.00">5A</button>
      <button class="btn-string" data-note="D3" data-freq="146.83">4D</button>
      <button class="btn-string" data-note="G3" data-freq="196.00">3G</button>
      <button class="btn-string" data-note="B3" data-freq="246.94">2B</button>
      <button class="btn-string" data-note="E4" data-freq="329.63">1E</button>
    </div>

    <!-- VISUALIZADORES EN TIEMPO REAL -->
    <div class="vis-container">
      <div class="vis-card"><canvas id="waveCanvas" width="250" height="80"></canvas></div>
      <div class="vis-card"><canvas id="specCanvas" width="250" height="80"></canvas></div>
    </div>

    <!-- GRID DE BOTONES CON COLORES SÓLIDOS -->
    <div class="action-grid">
      <button class="btn-action btn-mic-main" id="micBtn">
        <span id="btnText">INICIAR AFINADOR</span>
      </button>

      <button class="btn-action btn-mode" id="modeBtn">
        <span>MODO: AUTO</span>
      </button>

      <button class="btn-action btn-tone" id="toneBtn">
        <span>SONIDO REF.</span>
      </button>

      <button class="btn-action btn-wave" id="waveTypeBtn">
        <span>ONDA: SENOIDAL</span>
      </button>

      <button class="btn-action btn-gate" id="gateBtn">
        <span>FILTRO: NORMAL</span>
      </button>
    </div>
  </main>

  <footer>
    LeamsiTUNER Deluxe • Frecuencia A4 Calibrable • Procesamiento DSP
  </footer>

  <script>
    const solidColors = [
      '#FF0055', '#00F0FF', '#00FF88', '#FFB700', '#B026FF',
      '#FF5722', '#0077FF', '#E91E63', '#7C4DFF', '#00E676'
    ];

    const loaderCircle = document.getElementById('loaderCircle');
    const loadingPercent = document.getElementById('loadingPercent');
    const brandRevealText = document.getElementById('brandRevealText');
    const splashScreen = document.getElementById('splash-screen');

    let progress = 0;
    const totalLength = 628;

    function runSplashLoader() {
      const interval = setInterval(() => {
        progress += 2;
        
        const offset = totalLength - (progress / 100) * totalLength;
        loaderCircle.style.strokeDashoffset = offset;

        const colorIndex = Math.floor((progress / 10)) % solidColors.length;
        loaderCircle.style.stroke = solidColors[colorIndex];
        loaderCircle.style.filter = `drop-shadow(0 0 10px ${solidColors[colorIndex]})`;

        loadingPercent.innerText = `CARGANDO... ${progress}%`;

        if (progress >= 100) {
          clearInterval(interval);
          loadingPercent.style.display = 'none';
          brandRevealText.classList.add('show');

          setTimeout(() => {
            splashScreen.classList.add('hidden');
          }, 1800);
        }
      }, 50);
    }

    window.addEventListener('DOMContentLoaded', runSplashLoader);

    // AUDIO & DSP SYSTEM
    const micBtn = document.getElementById('micBtn');
    const btnText = document.getElementById('btnText');
    const noteDisplay = document.getElementById('noteDisplay');
    const freqDisplay = document.getElementById('freqDisplay');
    const centsDisplay = document.getElementById('centsDisplay');
    const successBadge = document.getElementById('successBadge');
    const gaugeCard = document.getElementById('gaugeCard');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    const arrowLow = document.getElementById('arrowLow');
    const arrowHigh = document.getElementById('arrowHigh');

    const canvas = document.getElementById('gaugeCanvas');
    const ctx = canvas.getContext('2d');

    const waveCanvas = document.getElementById('waveCanvas');
    const waveCtx = waveCanvas.getContext('2d');

    const specCanvas = document.getElementById('specCanvas');
    const specCtx = specCanvas.getContext('2d');

    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let isListening = false;
    let animationFrameId = null;

    let customA4 = 440;
    let isAutoMode = true;
    let noiseGateThreshold = 0.012;
    let selectedTargetFreq = null;
    let activeOscillator = null;

    const waveTypes = ['sine', 'triangle', 'sawtooth', 'square'];
    const waveTypeNames = ['SENOIDAL', 'TRIANGULAR', 'SERRADA', 'CUADRADA'];
    let currentWaveIdx = 0;

    const NOTE_STRINGS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    let currentCents = 0;
    let targetCents = 0;

    function setupCanvasDPI() {
      const dpr = window.devicePixelRatio || 1;
      
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const wRect = waveCanvas.getBoundingClientRect();
      waveCanvas.width = wRect.width * dpr;
      waveCanvas.height = wRect.height * dpr;
      waveCtx.scale(dpr, dpr);

      const sRect = specCanvas.getBoundingClientRect();
      specCanvas.width = sRect.width * dpr;
      specCanvas.height = sRect.height * dpr;
      specCtx.scale(dpr, dpr);
    }
    window.addEventListener('resize', setupCanvasDPI);
    setupCanvasDPI();

    // CALIBRACIÓN A4
    const a4ValueDisplay = document.getElementById('a4ValueDisplay');
    document.getElementById('btnA4Down').addEventListener('click', () => {
      if (customA4 > 432) { customA4--; a4ValueDisplay.innerText = `${customA4} Hz`; }
    });
    document.getElementById('btnA4Up').addEventListener('click', () => {
      if (customA4 < 445) { customA4++; a4ValueDisplay.innerText = `${customA4} Hz`; }
    });

    // PRESETS DE AFINACIÓN (E, A, D, G, B, E)
    const tuningPresets = {
      STD: [82.41, 110.00, 146.83, 196.00, 246.94, 329.63],
      DROPD: [73.42, 110.00, 146.83, 196.00, 246.94, 329.63],
      HALF: [77.78, 103.83, 138.59, 185.00, 233.08, 311.13],
      FULL: [73.42, 98.00, 130.81, 174.61, 220.00, 293.66]
    };

    document.getElementById('presetSelect').addEventListener('change', (e) => {
      const freqs = tuningPresets[e.target.value] || tuningPresets.STD;
      const btns = document.querySelectorAll('.btn-string');
      btns.forEach((btn, idx) => {
        btn.dataset.freq = freqs[idx];
      });
    });

    // DIBUJADO DEL DIAL
    function drawGauge(cents) {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      const centerX = width / 2;
      const centerY = height * 0.82;
      const radius = Math.min(width, height) * 0.72;

      ctx.clearRect(0, 0, width, height);

      const startAngle = Math.PI * 0.8;
      const endAngle = Math.PI * 2.2;

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.lineWidth = 12;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineCap = 'round';
      ctx.stroke();

      const tunedWidth = 0.08;
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, (Math.PI * 1.5) - tunedWidth, (Math.PI * 1.5) + tunedWidth);
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#00ff88';
      ctx.shadowColor = '#00ff88';
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;

      const totalTicks = 21;
      for (let i = 0; i < totalTicks; i++) {
        const tickCents = -50 + (i * 5);
        const angle = Math.PI * 1.5 + (tickCents * (Math.PI / 180) * 0.9);
        const isMajor = i % 5 === 0;
        const isCenter = tickCents === 0;

        const innerR = radius - (isMajor ? 22 : 12);
        const outerR = radius - 8;

        const x1 = centerX + Math.cos(angle) * innerR;
        const y1 = centerY + Math.sin(angle) * innerR;
        const x2 = centerX + Math.cos(angle) * outerR;
        const y2 = centerY + Math.sin(angle) * outerR;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = isCenter ? 4 : (isMajor ? 2.5 : 1.5);
        ctx.strokeStyle = isCenter ? '#00ff88' : (isMajor ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.15)');
        ctx.stroke();
      }

      currentCents += (targetCents - currentCents) * 0.15;
      const clampedCents = Math.max(-50, Math.min(50, currentCents));
      const needleAngle = Math.PI * 1.5 + (clampedCents * (Math.PI / 180) * 0.9);

      let needleColor = '#00f0ff';
      const absCents = Math.abs(currentCents);

      if (isListening && noteDisplay.innerText !== '--') {
        if (absCents <= 3) {
          needleColor = '#00ff88';
          arrowLow.classList.remove('active-low');
          arrowHigh.classList.remove('active-high');
        } else if (currentCents < -3) {
          needleColor = '#ff0055';
          arrowLow.classList.add('active-low');
          arrowHigh.classList.remove('active-high');
        } else {
          needleColor = '#ffb700';
          arrowHigh.classList.add('active-high');
          arrowLow.classList.remove('active-low');
        }
      } else {
        needleColor = '#8b80b2';
        arrowLow.classList.remove('active-low');
        arrowHigh.classList.remove('active-high');
      }

      ctx.shadowColor = needleColor;
      ctx.shadowBlur = absCents <= 3 ? 20 : 10;

      const needleLength = radius - 15;
      const nx = centerX + Math.cos(needleAngle) * needleLength;
      const ny = centerY + Math.sin(needleAngle) * needleLength;

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(nx, ny);
      ctx.lineWidth = 4;
      ctx.strokeStyle = needleColor;
      ctx.lineCap = 'round';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
      ctx.fillStyle = needleColor;
      ctx.fill();

      ctx.shadowBlur = 0;
    }

    function drawWaveform(timeData) {
      const w = waveCanvas.width;
      const h = waveCanvas.height;
      waveCtx.clearRect(0, 0, w, h);
      if (!isListening || !timeData) return;

      waveCtx.beginPath();
      waveCtx.lineWidth = 2;
      waveCtx.strokeStyle = '#00f0ff';
      const sliceWidth = w / timeData.length;
      let x = 0;

      for (let i = 0; i < timeData.length; i += 4) {
        const v = timeData[i];
        const y = (v * (h / 2));
        if (i === 0) waveCtx.moveTo(x, y);
        else waveCtx.lineTo(x, y);
        x += sliceWidth * 4;
      }
      waveCtx.stroke();
    }

    function drawSpectrum(freqData) {
      const w = specCanvas.width;
      const h = specCanvas.height;
      specCtx.clearRect(0, 0, w, h);
      if (!isListening || !freqData) return;

      const barWidth = w / 20;
      for (let i = 0; i < 20; i++) {
        const val = freqData[i * 2] / 255;
        const barHeight = val * h;
        specCtx.fillStyle = '#b026ff';
        specCtx.fillRect(i * barWidth, h - barHeight, barWidth - 2, barHeight);
      }
    }

    function autoCorrelate(buf, sampleRate) {
      const SIZE = buf.length;
      let rms = 0;

      for (let i = 0; i < SIZE; i++) {
        const val = buf[i];
        rms += val * val;
      }
      rms = Math.sqrt(rms / SIZE);

      if (rms < noiseGateThreshold) return -1;

      let r1 = 0, r2 = SIZE - 1, thres = 0.2;
      for (let i = 0; i < SIZE / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < SIZE / 2; i++) {
        if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
      }

      buf = buf.slice(r1, r2);
      const c = new Array(buf.length).fill(0);

      for (let i = 0; i < buf.length; i++) {
        for (let j = 0; j < buf.length - i; j++) {
          c[i] = c[i] + buf[j] * buf[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;

      let maxval = -1, maxpos = -1;
      for (let i = d; i < buf.length; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }

      let T0 = maxpos;
      const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      const a = (x1 + x3 - 2 * x2) / 2;
      const b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      return sampleRate / T0;
    }

    function getNoteAndCents(freq) {
      const noteNum = 12 * (Math.log(freq / customA4) / Math.log(2));
      const midiNote = Math.round(noteNum) + 69;
      const noteName = NOTE_STRINGS[midiNote % 12];
      const cents = Math.floor((noteNum - Math.round(noteNum)) * 100);
      return { noteName, cents };
    }

    function processAudio() {
      if (!isListening) return;

      const buf = new Float32Array(2048);
      analyser.getFloatTimeDomainData(buf);

      const freqData = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(freqData);

      drawWaveform(buf);
      drawSpectrum(freqData);

      const pitch = autoCorrelate(buf, audioCtx.sampleRate);

      if (pitch !== -1 && pitch >= 60 && pitch <= 1000) {
        const { noteName, cents } = getNoteAndCents(pitch);
        
        noteDisplay.innerText = noteName;
        freqDisplay.innerText = `${pitch.toFixed(1)} Hz`;
        centsDisplay.innerText = `${cents > 0 ? '+' : ''}${cents} Cents`;
        targetCents = cents;

        if (Math.abs(cents) <= 3) {
          noteDisplay.classList.add('tuned');
          gaugeCard.classList.add('tuned');
          successBadge.classList.add('show');

          if (navigator.vibrate) {
            navigator.vibrate(50);
          }
        } else {
          noteDisplay.classList.remove('tuned');
          gaugeCard.classList.remove('tuned');
          successBadge.classList.remove('show');
        }

      } else {
        targetCents = 0;
      }

      drawGauge(currentCents);
      animationFrameId = requestAnimationFrame(processAudio);
    }

    async function toggleMicrophone() {
      if (isListening) {
        isListening = false;
        if (micStream) micStream.getTracks().forEach(track => track.stop());
        if (audioCtx) audioCtx.close();
        cancelAnimationFrame(animationFrameId);

        micBtn.classList.remove('listening');
        btnText.innerText = 'INICIAR AFINADOR';
        statusDot.classList.remove('active');
        statusText.innerText = 'PAUSADO';
        noteDisplay.innerText = '--';
        noteDisplay.classList.remove('tuned');
        gaugeCard.classList.remove('tuned');
        successBadge.classList.remove('show');
        freqDisplay.innerText = '0.0 Hz';
        centsDisplay.innerText = '0 Cents';
        targetCents = 0;
        drawGauge(0);
        drawWaveform(null);
        drawSpectrum(null);

      } else {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }

          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false,
              latency: 0
            }
          });

          const source = audioCtx.createMediaStreamSource(micStream);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          source.connect(analyser);

          isListening = true;
          micBtn.classList.add('listening');
          btnText.innerText = 'DETENER AFINADOR';
          statusDot.classList.add('active');
          statusText.innerText = 'ESCUCHANDO';

          processAudio();

        } catch (err) {
          alert('Error al acceder al micrófono. Por favor, concede permisos en tu navegador.');
          console.error(err);
        }
      }
    }

    // CONTROLES DE ACCIÓN
    document.getElementById('modeBtn').addEventListener('click', (e) => {
      isAutoMode = !isAutoMode;
      e.currentTarget.querySelector('span').innerText = isAutoMode ? 'MODO: AUTO' : 'MODO: MANUAL';
    });

    document.getElementById('waveTypeBtn').addEventListener('click', (e) => {
      currentWaveIdx = (currentWaveIdx + 1) % waveTypes.length;
      e.currentTarget.querySelector('span').innerText = `ONDA: ${waveTypeNames[currentWaveIdx]}`;
      if (activeOscillator) activeOscillator.type = waveTypes[currentWaveIdx];
    });

    document.getElementById('gateBtn').addEventListener('click', (e) => {
      if (noiseGateThreshold === 0.012) {
        noiseGateThreshold = 0.025;
        e.currentTarget.querySelector('span').innerText = 'FILTRO: ALTO';
      } else {
        noiseGateThreshold = 0.012;
        e.currentTarget.querySelector('span').innerText = 'FILTRO: NORMAL';
      }
    });

    const toneBtn = document.getElementById('toneBtn');
    toneBtn.addEventListener('click', async () => {
      if (activeOscillator) {
        activeOscillator.stop();
        activeOscillator = null;
        toneBtn.querySelector('span').innerText = 'SONIDO REF.';
      } else {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        activeOscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        activeOscillator.type = waveTypes[currentWaveIdx];
        activeOscillator.frequency.value = selectedTargetFreq || customA4;
        
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        activeOscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        activeOscillator.start();
        toneBtn.querySelector('span').innerText = 'DETENER TONO';
      }
    });

    const stringButtons = document.querySelectorAll('.btn-string');
    stringButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        stringButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTargetFreq = parseFloat(btn.dataset.freq);
        if (activeOscillator) activeOscillator.frequency.value = selectedTargetFreq;
      });
    });

    micBtn.addEventListener('click', toggleMicrophone);
    drawGauge(0);
  </script>
</body>
</html>
